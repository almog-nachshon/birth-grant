<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- דפוס חדר תינוקות. קווי מתאר בלבד, נטול תלות חיצונית.
       השקיפות נקבעת ב-CSS דרך השכבה שמציגה אותו, לא כאן. -->
  <defs>
    <g id="pacifier" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="6.2"/>
      <circle cx="0" cy="9.6" r="3.6"/>
      <path d="M-3,-5.4 C-3,-10.4 3,-10.4 3,-5.4"/>
    </g>
    <g id="bottle" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-1.8,-13.4 q1.8,-2.6 3.6,0 v3.6 h-3.6 z"/>
      <path d="M-4.6,-9.8 h9.2 v2.6 h-9.2 z"/>
      <rect x="-5.4" y="-7.2" width="10.8" height="16.6" rx="3.4"/>
      <path d="M-2.2,-2.8 h4.4 M-2.2,1.4 h4.4"/>
    </g>
    <g id="rattle" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-4.2" r="6.2"/>
      <path d="M0,2 v7.6"/>
      <path d="M-3.2,10.2 h6.4"/>
      <circle cx="-2.2" cy="-5.4" r=".9"/>
      <circle cx="2.4" cy="-2.6" r=".9"/>
    </g>
    <g id="foot" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-4.2,6.4 C-8.4,0 -6.2,-6.6 0,-6.6 C6.2,-6.6 8.4,0 4.2,6.4 C2.2,9.4 -2.2,9.4 -4.2,6.4 Z"/>
      <circle cx="-3.4" cy="-8.8" r="1.5"/>
      <circle cx="0" cy="-10.2" r="1.5"/>
      <circle cx="3.4" cy="-9.2" r="1.3"/>
    </g>
    <g id="star" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,-8 L2.3,-2.6 L8,-2.3 L3.5,1.3 L5,7 L0,3.7 L-5,7 L-3.5,1.3 L-8,-2.3 L-2.3,-2.6 Z"/>
    </g>
    <g id="cloud" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10,4.4 a5.2,5.2 0 0 1 .7,-10.3 a7.2,7.2 0 0 1 13.6,-1 a5.6,5.6 0 0 1 1.3,11.3 z"/>
    </g>
    <g id="heart" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,7.2 C-8.2,1 -8.2,-6.2 -3.7,-6.2 C-1.4,-6.2 0,-4.3 0,-2.9 C0,-4.3 1.4,-6.2 3.7,-6.2 C8.2,-6.2 8.2,1 0,7.2 Z"/>
    </g>
    <g id="onesie" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6.4,-8 L-9.6,-4.6 L-6.4,-1.4 V4.8 q0,4.2 3.2,4.2 h6.4 q3.2,0 3.2,-4.2 V-1.4 L9.6,-4.6 L6.4,-8 q-3.2,2.2 -6.4,2.2 q-3.2,0 -6.4,-2.2 Z"/>
    </g>
    <g id="bear" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-5.4" cy="-5.2" r="2.9"/>
      <circle cx="5.4" cy="-5.2" r="2.9"/>
      <circle cx="0" cy="1.2" r="6.4"/>
      <circle cx="-2.3" cy="0" r=".9"/>
      <circle cx="2.3" cy="0" r=".9"/>
      <path d="M-1.8,3.6 q1.8,1.8 3.6,0"/>
    </g>
    <g id="moon" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.6,-7.4 A8,8 0 1 0 3.6,7.4 A6.6,6.6 0 0 1 3.6,-7.4 Z"/>
    </g>
  </defs>

  <g stroke="#E08340" stroke-opacity=".17">
    <use href="#pacifier" transform="translate(34,38) rotate(-14)"/>
    <use href="#star"     transform="translate(158,26) rotate(12)"/>
    <use href="#heart"    transform="translate(96,118) rotate(-8)"/>
    <use href="#bottle"   transform="translate(214,104) rotate(16)"/>
    <use href="#bear"     transform="translate(46,196) rotate(6)"/>
    <use href="#star"     transform="translate(196,224) rotate(-18)"/>
  </g>
  <g stroke="#3F86B4" stroke-opacity=".16">
    <use href="#cloud"    transform="translate(104,44) rotate(4)"/>
    <use href="#rattle"   transform="translate(226,44) rotate(-20)"/>
    <use href="#foot"     transform="translate(30,110) rotate(-24)"/>
    <use href="#onesie"   transform="translate(160,152) rotate(10)"/>
    <use href="#moon"     transform="translate(116,216) rotate(-10)"/>
    <use href="#pacifier" transform="translate(238,178) rotate(22)"/>
  </g>
</svg>
